<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Light Metallic Silver Gradient -->
    <linearGradient id="silverLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Dark 3D Shadow Facet Gradient -->
    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Chrome Metallic Accent Glow for Crescents -->
    <linearGradient id="crescentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- ==================== 1. TOP-LEFT CRESCENT ARC ==================== -->
    <!-- Dark shadow bevel layer for crescent -->
    <path d="M 285 92 C 160 85, 115 170, 140 295 C 130 185, 175 105, 285 92 Z"
          fill="url(#silverDark)" opacity="0.6" />
    <!-- Main Silver Crescent Arc -->
    <path d="M 290 88 
             C 165 82, 118 165, 142 290 
             C 128 178, 178 100, 290 88 Z" 
          fill="url(#crescentGrad)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

    <!-- ==================== 2. BOTTOM-RIGHT CRESCENT ARC ==================== -->
    <!-- Dark shadow bevel layer for crescent -->
    <path d="M 215 408 C 340 415, 385 330, 360 205 C 370 315, 325 395, 215 408 Z"
          fill="url(#silverDark)" opacity="0.6" />
    <!-- Main Silver Crescent Arc -->
    <path d="M 210 412 
             C 335 418, 382 335, 358 210 
             C 372 322, 322 400, 210 412 Z" 
          fill="url(#crescentGrad)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

    <!-- ==================== 3. ROCKET SHADOW / BEVEL FACET (BOTTOM RIGHT HALF) ==================== -->
    <path d="M 445 70 
             L 182 318 
             L 42 442 
             L 115 372 
             L 150 372 
             L 205 410 
             L 270 325 
             L 305 328 
             L 298 280 
             L 445 70 Z" 
          fill="url(#silverDark)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Inner Shadow Accent cutouts for rocket tail -->
    <path d="M 182 318 L 122 368 L 155 368 L 205 408 L 265 325 L 305 328 L 298 280 L 182 318 Z" 
          fill="#0a0f1d" opacity="0.4" />

    <!-- ==================== 4. ROCKET LIGHT / HIGHLIGHT FACET (TOP LEFT HALF) ==================== -->
    <path d="M 445 70 
             C 390 120, 335 170, 305 195 
             L 250 202 
             L 295 240 
             C 272 260, 230 292, 182 318 
             L 42 442 
             C 95 395, 140 355, 175 330 
             L 125 338 
             L 165 315 
             L 182 318 
             C 280 238, 360 158, 445 70 Z" 
          fill="url(#silverLight)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

    <!-- ==================== 5. CENTER BEVEL CREASE SPINE ==================== -->
    <path d="M 445 70 L 182 318 L 42 442" 
          fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>